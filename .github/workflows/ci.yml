name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit
        name: Type check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:unit
        name: Run unit tests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    env:
      # Minimal env vars required for Next.js build (non-functional values)
      DATABASE_URI: postgresql://placeholder:placeholder@localhost:5432/placeholder
      PAYLOAD_SECRET: ci-build-secret-must-be-at-least-32-chars-long
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        name: Next.js build

  # ─── Failure Notification ───────────────────────────────────────
  # Sends an email to hello@spacesangels.com whenever any CI job fails.
  # Uses Resend SMTP (or any SMTP provider).
  #
  # Required GitHub Secret:
  #   RESEND_API_KEY — your Resend API key (re_xxxxxxxxx)
  #     GitHub repo → Settings → Secrets and variables → Actions → New secret
  #
  # Resend SMTP settings (used below):
  #   Server:   smtp.resend.com
  #   Port:     465
  #   Username: resend
  #   Password: <RESEND_API_KEY>
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, build]
    if: failure()
    steps:
      - name: Send failure email to LEO inbox
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          to: hello@spacesangels.com
          from: Angel OS CI <ci@spacesangels.com>
          subject: "❌ CI failed on ${{ github.ref_name }} — ${{ github.repository }}"
          body: |
            A CI pipeline failure was detected on Angel OS.

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit     : ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            View the failed run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            — Angel OS CI
