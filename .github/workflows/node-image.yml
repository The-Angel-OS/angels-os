name: Node image

# Builds the Core container and pushes it to GHCR so a self-hosted node can PULL
# it instead of building it.
#
# Why this exists: `next build` on a 7 GB ThinkPad thrashes and then fails, and
# the wrong conclusion drawn from that failure is that the hardware is too small.
# A GitHub runner has 16 GB and does it in minutes. This is the "build in CI,
# push a tag, pull it there" the self-host README always pointed at.
#
# Deliberately NOT on every push to main — a node image is something you decide
# to cut, not a side effect of a commit. Tag it, or run it by hand.

on:
  workflow_dispatch:
  push:
    tags: ['node-v*']

concurrency:
  group: node-image
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` is what a node pulls; the sha tag is what you roll back to
          # when latest turns out to be a bad afternoon.
          tags: |
            ghcr.io/${{ github.repository_owner }}/angels-os-core:latest
            ghcr.io/${{ github.repository_owner }}/angels-os-core:${{ github.sha }}
          # The runner's own cache — a cold build of Payload + Next is slow, and
          # this is the difference between minutes and a coffee break.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What to run on the node
        run: |
          echo "docker pull ghcr.io/${{ github.repository_owner }}/angels-os-core:latest"
          echo "docker tag  ghcr.io/${{ github.repository_owner }}/angels-os-core:latest angelos-core:local"
