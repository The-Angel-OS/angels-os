<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Angel OS">
  <title>The Angel OS</title>
  <!--
    Favicon-size variant of angel-mark.svg. The full mark's wings collapse into
    blobs below ~48px and its margins waste half the frame, so at 16-32px we
    keep only what survives: halo, head, smile — scaled to fill, strokes thick
    enough to hold one pixel each. Same amber, same silhouette, legible on a
    light or dark tab strip.
  -->
  <g fill="none" stroke="#f5a623" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="16" cy="4.9" rx="7.3" ry="2.1" stroke-width="2.3"/>
    <circle cx="16" cy="20.3" r="9.5" stroke-width="2.7"/>
    <path d="M11.9 19.6 C 13.0 23.4, 19.0 23.4, 20.1 19.6" stroke-width="2.5"/>
  </g>
</svg>
