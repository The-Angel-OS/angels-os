<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="leoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#31104b" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="leoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="aiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#aiShadow)">
    <!-- Container Window -->
    <rect x="20" y="20" width="860" height="510" rx="16" fill="url(#leoBg)" stroke="#374151" stroke-width="2"/>

    <!-- Header bar with LEO brand & live RAG indicator -->
    <rect x="20" y="20" width="860" height="60" rx="16" fill="#0f172a"/>
    <line x1="20" y1="80" x2="880" y2="80" stroke="#1f2937" stroke-width="1"/>

    <circle cx="55" cy="50" r="18" fill="url(#leoAccent)"/>
    <text x="55" y="56" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">LEO</text>
    <text x="85" y="47" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff">LEO 2.0 — Creator Vector RAG</text>
    <text x="85" y="64" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Trained on 11,480+ YouTube Transcript Chunks · pgvector HNSW</text>

    <!-- Real-time Status Badge -->
    <rect x="710" y="38" width="145" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="725" cy="51" r="4" fill="#10b981"/>
    <text x="736" y="55" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34d399">ONLINE &amp; INDEXED</text>

    <!-- CHAT CONTENT -->
    <!-- 1. Fan Question Bubble (Right aligned) -->
    <g transform="translate(320, 110)">
      <rect x="0" y="0" width="530" height="74" rx="16" fill="#2563eb" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1"/>
      <text x="24" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#93c5fd">Visitor / Fan Inquiry</text>
      <text x="24" y="52" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#f8fafc">"Where did you discuss the brick volume anomaly in the 1893 Chicago World's Fair?"</text>
    </g>

    <!-- 2. LEO Answer Bubble (Left aligned) -->
    <g transform="translate(45, 205)">
      <rect x="0" y="0" width="810" height="235" rx="16" fill="url(#aiBubble)" stroke="#8b5cf6" stroke-width="1.5"/>

      <!-- LEO Header inside bubble -->
      <circle cx="35" cy="35" r="16" fill="url(#leoAccent)"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">AI</text>
      <text x="65" y="33" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#e9d5ff">LEO Site Assistant</text>
      <rect x="200" y="21" width="95" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.3"/>
      <text x="247" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#c084fc" text-anchor="middle">Cosine Sim: 0.94</text>

      <!-- Answer prose -->
      <text x="35" y="75" font-family="system-ui, sans-serif" font-weight="400" font-size="13.5" fill="#f3e8ff">
        "That was covered extensively in Episode #102 ('The Impossible 1893 Timeline'). The census data shows only
      </text>
      <text x="35" y="96" font-family="system-ui, sans-serif" font-weight="400" font-size="13.5" fill="#f3e8ff">
        6,000 licensed masonry workers in the county, yet over 200 million brick-equivalents were allegedly laid in 14 months."
      </text>

      <!-- Grounded Citation Card (Clickable Deep Link) -->
      <g transform="translate(35, 120)">
        <rect x="0" y="0" width="740" height="90" rx="10" fill="#030712" fill-opacity="0.6" stroke="#4c1d95" stroke-width="1.5"/>
        <!-- Video thumbnail preview icon -->
        <rect x="15" y="15" width="105" height="60" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <polygon points="60,37 60,53 74,45" fill="#ef4444"/>
        <text x="67" y="68" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#9ca3af" text-anchor="middle">EPISODE #102</text>

        <!-- Video Title & Citation text -->
        <text x="135" y="36" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Episode #102: The Chicago Exposition Architectural Audit</text>
        <text x="135" y="58" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#a1a1aa">Exact segment transcript chunk #4218 · Duration: 28:44</text>

        <!-- Clickable timestamp button -->
        <g transform="translate(580, 26)">
          <rect x="0" y="0" width="140" height="38" rx="8" fill="#f59e0b"/>
          <text x="70" y="23" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#000000" text-anchor="middle">▶ Play at [14:22] ↗</text>
        </g>
      </g>
    </g>

    <!-- Bottom input bar -->
    <g transform="translate(45, 460)">
      <rect x="0" y="0" width="810" height="46" rx="10" fill="#090d16" stroke="#1f2937" stroke-width="1.5"/>
      <text x="20" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Ask LEO anything about this channel's videos, products, or events...</text>
      <rect x="740" y="7" width="60" height="32" rx="6" fill="#8b5cf6"/>
      <text x="770" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Ask</text>
    </g>
  </g>
</svg>
