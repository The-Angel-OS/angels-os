<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep atmospheric studio background gradient -->
    <radialGradient id="heroBg" cx="65%" cy="35%" r="75%" fx="60%" fy="30%">
      <stop offset="0%" stop-color="#2d1b69" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#181236" stop-opacity="0.98"/>
      <stop offset="65%" stop-color="#0c0a1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06050d" stop-opacity="1"/>
    </radialGradient>

    <!-- Aurora glow 1: Violet/Magenta -->
    <radialGradient id="glowViolet" cx="70%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora glow 2: Coral/Amber -->
    <radialGradient id="glowCoral" cx="30%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora glow 3: Electric Indigo -->
    <radialGradient id="glowIndigo" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle studio grid pattern -->
    <pattern id="studioGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
      <circle cx="0" cy="0" r="1.5" fill="#a855f7" fill-opacity="0.2"/>
    </pattern>

    <!-- Audio waveform gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Card glassmorphism linear -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#heroBg)"/>

  <!-- Aurora lighting spheres -->
  <rect width="1920" height="1080" fill="url(#glowViolet)"/>
  <rect width="1920" height="1080" fill="url(#glowCoral)"/>
  <rect width="1920" height="1080" fill="url(#glowIndigo)"/>

  <!-- Technical studio grid overlay -->
  <rect width="1920" height="1080" fill="url(#studioGrid)"/>

  <!-- Modern diagonal light beams -->
  <g opacity="0.15">
    <polygon points="1200,0 1500,0 900,1080 600,1080" fill="url(#waveGrad)"/>
    <polygon points="1600,0 1850,0 1350,1080 1100,1080" fill="url(#waveGrad)"/>
  </g>

  <!-- Ambient Audio Waveform Elements (lower right background) -->
  <g opacity="0.35" transform="translate(1100, 720)">
    <rect x="0" y="40" width="6" height="80" rx="3" fill="#a855f7"/>
    <rect x="16" y="20" width="6" height="120" rx="3" fill="#c084fc"/>
    <rect x="32" y="60" width="6" height="40" rx="3" fill="#7c3aed"/>
    <rect x="48" y="10" width="6" height="140" rx="3" fill="#e879f9"/>
    <rect x="64" y="30" width="6" height="100" rx="3" fill="#f43f5e"/>
    <rect x="80" y="5" width="6" height="150" rx="3" fill="#fb7185"/>
    <rect x="96" y="25" width="6" height="110" rx="3" fill="#ec4899"/>
    <rect x="112" y="50" width="6" height="60" rx="3" fill="#f472b6"/>
    <rect x="128" y="15" width="6" height="130" rx="3" fill="#fb923c"/>
    <rect x="144" y="35" width="6" height="90" rx="3" fill="#f59e0b"/>
    <rect x="160" y="55" width="6" height="50" rx="3" fill="#fbbf24"/>
    <rect x="176" y="20" width="6" height="120" rx="3" fill="#ec4899"/>
    <rect x="192" y="10" width="6" height="140" rx="3" fill="#c084fc"/>
    <rect x="208" y="45" width="6" height="70" rx="3" fill="#a855f7"/>
    <rect x="224" y="30" width="6" height="100" rx="3" fill="#818cf8"/>
    <rect x="240" y="65" width="6" height="30" rx="3" fill="#6366f1"/>
    <rect x="256" y="15" width="6" height="130" rx="3" fill="#38bdf8"/>
    <rect x="272" y="40" width="6" height="80" rx="3" fill="#60a5fa"/>
    <rect x="288" y="25" width="6" height="110" rx="3" fill="#818cf8"/>
    <rect x="304" y="50" width="6" height="60" rx="3" fill="#a855f7"/>
  </g>

  <!-- Video timeline track lines (ambient) -->
  <g opacity="0.2" transform="translate(100, 960)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6"/>
    <line x1="0" y1="20" x2="1720" y2="20" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="16 10"/>
    <line x1="0" y1="40" x2="1720" y2="40" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="12 8"/>
  </g>

  <!-- Camera focus reticle corners (top right) -->
  <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" fill="none" transform="translate(1780, 80)">
    <path d="M 0 20 L 0 0 L 20 0"/>
    <path d="M 60 0 L 80 0 L 80 20"/>
    <path d="M 80 60 L 80 80 L 60 80"/>
    <path d="M 20 80 L 0 80 L 0 60"/>
    <circle cx="40" cy="40" r="12" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="40" cy="40" r="2" fill="#ef4444" fill-opacity="0.7" stroke="none"/>
  </g>

  <!-- Starfleet / LCARS subtle accent lines -->
  <g opacity="0.3">
    <path d="M 60 120 L 220 120 L 260 160 L 480 160" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <circle cx="60" cy="120" r="4" fill="#f59e0b"/>
    <rect x="270" y="152" width="40" height="4" fill="#ec4899"/>
    <rect x="320" y="152" width="20" height="4" fill="#8b5cf6"/>
  </g>
</svg>
