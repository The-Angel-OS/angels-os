<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Angel OS favicon: matches Payload admin icon (halo + wings + body) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Halo -->
  <ellipse cx="16" cy="8" rx="7" ry="2.5" stroke="#f5a623" stroke-width="1.8" fill="none"/>
  <!-- Wings -->
  <path d="M16 14 C10 14, 5 17, 3 24 C7 20, 11 19, 16 19" stroke="#f5a623" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M16 14 C22 14, 27 17, 29 24 C25 20, 21 19, 16 19" stroke="#f5a623" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <circle cx="16" cy="19" r="3.5" fill="#f5a623" opacity="0.25"/>
  <circle cx="16" cy="19" r="3.5" stroke="#f5a623" stroke-width="1.3" fill="none"/>
</svg>
