<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Angel OS favicon: bold, readable at 16px -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e30"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Halo — thick, bright, unmistakable -->
  <ellipse cx="16" cy="7.5" rx="6.5" ry="2.2" stroke="#f5a623" stroke-width="2.5" fill="none"/>
  <!-- Wings — filled for visibility at small sizes -->
  <path d="M16 13 C11 13, 5 16, 3 23 C7 19, 11 18, 16 18 Z" fill="#f5a623" opacity="0.5"/>
  <path d="M16 13 C21 13, 27 16, 29 23 C25 19, 21 18, 16 18 Z" fill="#f5a623" opacity="0.5"/>
  <path d="M16 13 C11 13, 5 16, 3 23 C7 19, 11 18, 16 18" stroke="#f5a623" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M16 13 C21 13, 27 16, 29 23 C25 19, 21 18, 16 18" stroke="#f5a623" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Body — solid fill, visible -->
  <circle cx="16" cy="19.5" r="4" fill="#f5a623" opacity="0.35"/>
  <circle cx="16" cy="19.5" r="4" stroke="#f5a623" stroke-width="2" fill="none"/>
</svg>
